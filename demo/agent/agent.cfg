Devices = Devices.xml
SchemaVersion = 2.7
WorkerThreads = 3
MonitorConfigFiles = yes
Port = 5001
JsonVersion = 2

MinCompressFileSize = 10k
DataPath = ../..

Files {
  schemas {
    Path = schemas
    Location = /schemas/
  }
  styles {
    Path = styles
    Location = /styles/
  }
  Favicon {
      Path = ../../styles/favicon.ico
      Location = /favicon.ico
  }
}

Directories {
  twin {
    Path = ../twin/
    Location = /twin/
    Default = index.html
  }
}

Sinks {
#  MqttService {
#  }
}

# The style sheets are disabled autmatically when the browser view is active. commnenting
# them out here suppresses the warning on startup.

# DevicesStyle { Location = /styles/styles.xsl }
# StreamsStyle { Location = /styles/styles.xsl }

# Browsers that list text/html first get this page, which reads the agent's XML or JSON with
# JavaScript. The stylesheet entries above stay for XML clients that still support XSLT.
BrowserView = styles/viewer.html

Adapters {
  OKUMA {
    Port = 7878
    Host = 127.0.0.1
  }
  Mazak {
    Port = 7879
    Host = 127.0.0.1
  }
}

logger_config {
  output = file agent.log
  level = warning
}